# Publica o Gerador de Documentos como site estático no Cloudflare
# (Workers com Static Assets), servindo a pasta gerador-documentos/.
# Não há build: o Cloudflare apenas entrega os arquivos estáticos.
#
# Observação: este arquivo na raiz existe só para o deploy do gerador.
# Ele NÃO afeta o sistema Next.js do repositório.
name = "escritorioclarissaoliveira"
compatibility_date = "2024-11-01"

[assets]
directory = "gerador-documentos"
